<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Classroom Noise Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
        }

        .left-section {
            flex: 1;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .left-section h1 {
            font-size: 36px;
            text-align: center;
        }

        .right-section {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 100px;
            background: #f8f9fc;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .login-container h2 {
            margin-bottom: 25px;
            color: #333;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 14px;
            color: #555;
            display: block;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #4e73df;
            box-shadow: 0 0 5px rgba(78,115,223,0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #4e73df;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #2e59d9;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .right-section {
                justify-content: center;
                padding-right: 0;
                padding: 40px;
            }

            .left-section {
                height: 40vh;
            }
        }
    </style>
</head>
<body>

    <div class="left-section">
        <h1>Classroom Noise Detection System</h1>
    </div>

    <div class="right-section">
        <div class="login-container">
            <h2>Login</h2>
            <form action="#" method="POST">

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" required>
                </div>

                <button type="submit" class="login-btn">Login</button>

            </form>
        </div>
    </div>

</body>
</html>
